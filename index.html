<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경찰대 어원 학습기</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #070b16;
      color: #fff;
      min-height: 100vh;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px 16px;
    }

    /* ── Header ─────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 860px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 36px;
    }

    .header-badge {
      background: rgba(37,99,235,0.14);
      border: 1px solid rgba(37,99,235,0.4);
      color: #60a5fa;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 5px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .app-title {
      font-size: 15px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      flex: 1;
    }

    .word-counter {
      font-size: 13px;
      color: rgba(255,255,255,0.25);
      font-family: 'Courier New', monospace;
    }

    /* ── Main layout ────────────────────────────────── */
    .app-main {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 860px;
      flex: 1;
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.55);
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      transform: scale(1.08);
    }

    .card-container { flex: 1; }

    /* ── Word display ───────────────────────────────── */
    .word-display {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .main-word { text-align: center; padding: 4px 0 8px; }

    .word-text {
      font-size: clamp(38px, 8vw, 62px);
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff 0%, #93c5fd 55%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .word-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }

    .pronunciation {
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    .divider-dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    .korean { color: #93c5fd; font-size: 16px; font-weight: 600; }

    /* ── Etymology section ──────────────────────────── */
    .etymology-section {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 22px 16px 20px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      margin-bottom: 20px;
    }

    .etymology-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      flex-wrap: wrap;
    }

    .etym-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 110px;
    }

    .etym-meaning { text-align: center; }

    .meaning-text {
      font-size: 12px;
      color: rgba(255,255,255,0.52);
      line-height: 1.5;
    }

    .connector {
      font-size: 20px;
      color: rgba(255,255,255,0.14);
      font-weight: 200;
      padding-top: 34px;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Mnemonic ───────────────────────────────────── */
    .mnemonic-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(251,191,36,0.06);
      border: 1px solid rgba(251,191,36,0.18);
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.72);
    }

    .mnemonic-icon { font-size: 18px; line-height: 1; flex-shrink: 0; margin-top: 2px; }

    /* ── Situation ──────────────────────────────────── */
    .situation-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-left: 3px solid #3b82f6;
      border-radius: 2px 14px 14px 2px;
      padding: 18px 20px;
    }

    .situation-en {
      font-size: 15px;
      color: rgba(255,255,255,0.72);
      font-style: italic;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .situation-ko {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      line-height: 1.5;
    }

    /* ── Progress dots ──────────────────────────────── */
    .progress-dots {
      display: flex;
      gap: 8px;
      margin-top: 28px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.14);
      cursor: pointer;
      transition: background 0.25s, transform 0.25s;
      padding: 0;
    }

    .dot.active { background: #3b82f6; transform: scale(1.4); }
    .dot:hover:not(.active) { background: rgba(255,255,255,0.35); }

    .keyboard-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      margin-top: 12px;
      padding-bottom: 20px;
      letter-spacing: 0.3px;
    }

    kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─────────────────────────────────────────────────────────────────────────
    //  어휘 JSON 데이터
    // ─────────────────────────────────────────────────────────────────────────
    const VOCAB_DATA = [
      {
        id: 1,

        korean: "애매한, 모호한",
        etymology: [
          { part: "ambi-",       meaning: "양쪽, 둘 다",      origin: "Latin",  color: "#4ECDC4" },
          { part: "ig (agere)",  meaning: "이끌다, 몰다",     origin: "Latin",  color: "#45B7D1" },
          { part: "-uous",       meaning: "형용사 접미사",    origin: "Latin",  color: "#96CEB4" }
        ],

        situation: {

      },
      {
        id: 2,

      {

      {

        etymology: [
          { part: "inter-",  meaning: "사이에, 서로",      origin: "Latin",  color: "#FF9F43" },
          { part: "rog-",    meaning: "묻다 (rogare)",     origin: "Latin",  color: "#EE5A24" },

      },

        mnemonic: "심판(arbiter)이 마음대로 결정하듯 → 임의적인",

      {
        id: 9, word: "contraband", pronunciation: "/ˈkɒntrəbænd/", korean: "밀수품, 금제품",

          { part: "contra-", meaning: "반대로, 위반하여", origin: "Latin",   color: "#C77DFF" },
          { part: "band",    meaning: "법령, 포고",       origin: "Italian", color: "#9D4EDD" }

      {
        id: 10, word: "detain", pronunciation: "/dɪˈteɪn/", korean: "억류하다, 구금하다",

          { part: "de-",   meaning: "아래로, 강조",  origin: "Latin", color: "#74B9FF" },

            <text x="52" y="63" textAnchor="middle"
              fill="rgba(255,255,255,0.28)"
              fontSize="10" fontFamily="sans-serif">
              {data.origin}
            </text>
          </svg>
          <div ref={textRef} className="etym-meaning">
            <span className="t meaning-text">{data.meaning}</span>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────
    //  WordDisplay — 단어 전체 카드
    // ─────────────────────────────────────────────────────────────────────────
    const WordDisplay = ({ wordData }) => {
      const wordRef      = useRef(null);
      const mnemonicRef  = useRef(null);
      const situationRef = useRef(null);

      // 어원 원이 다 그려진 뒤 연상법·예문이 등장하도록 딜레이 계산
      const afterEtymDelay = wordData.etymology.length * 0.30 + 0.95;

      useEffect(() => {
        gsap.set([wordRef.current, mnemonicRef.current, situationRef.current], {
          opacity: 0, y: 16
        });

        const tl = gsap.timeline();

        tl.to(wordRef.current, {
          opacity: 1, y: 0, duration: 0.55, ease: "power3.out"
        })
        .to(mnemonicRef.current, {
          opacity: 1, y: 0, duration: 0.45, ease: "power2.out"
        }, `+=${afterEtymDelay}`)
        .to(situationRef.current, {
          opacity: 1, y: 0, duration: 0.45, ease: "power2.out"
        }, "-=0.1");

        return () => tl.kill();
      }, []);

      return (
        <div className="word-display">
          {/* ── 단어 + 메타 ── */}
          <div ref={wordRef} className="main-word" style={{ opacity: 0 }}>
            <h1 className="word-text">{wordData.word}</h1>
            <div className="word-meta">
              <span className="pronunciation">{wordData.pronunciation}</span>
              <span className="divider-dot" />
              <span className="korean">{wordData.korean}</span>
            </div>
          </div>

          {/* ── 어원 분석 ── */}
          <div className="etymology-section">
            <p className="section-label">어원 분석 · Etymology</p>
            <div className="etymology-row">
              {wordData.etymology.map((etym, i) => (
                <React.Fragment key={i}>
                  <EtymologyNode data={etym} index={i} />
                  {i < wordData.etymology.length - 1 && (
                    <div className="connector">+</div>
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>

          {/* ── 연상 기억법 ── */}
          <div ref={mnemonicRef} className="mnemonic-box" style={{ opacity: 0 }}>
            <span className="mnemonic-icon">💡</span>
            <span>{wordData.mnemonic}</span>
          </div>

          {/* ── 예문 ── */}
          <div ref={situationRef} className="situation-box" style={{ opacity: 0 }}>
            <p className="section-label">예문 · Example</p>
            <p className="situation-en">"{wordData.situation.en}"</p>
            <p className="situation-ko">{wordData.situation.ko}</p>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────────────────
    //  App — 루트 컴포넌트
    // ─────────────────────────────────────────────────────────────────────────
    const App = () => {
      const [currentIndex, setCurrentIndex] = useState(0);
      const containerRef = useRef(null);

      // 슬라이드 전환 헬퍼
      const animateTo = useCallback((nextIndex, dir) => {
        gsap.to(containerRef.current, {
          opacity: 0,
          x: dir === 1 ? -52 : 52,
          duration: 0.22,
          ease: "power2.in",
          onComplete: () => {
            setCurrentIndex(nextIndex);
            gsap.fromTo(containerRef.current,
              { opacity: 0, x: dir === 1 ? 52 : -52 },
              { opacity: 1, x: 0, duration: 0.38, ease: "power2.out" }
            );
          }
        });
      }, []);

      const navigate = useCallback((dir) => {
        const next = (currentIndex + dir + VOCAB_DATA.length) % VOCAB_DATA.length;
        animateTo(next, dir);
      }, [currentIndex, animateTo]);

      const goTo = useCallback((idx) => {
        if (idx === currentIndex) return;
        animateTo(idx, idx > currentIndex ? 1 : -1);
      }, [currentIndex, animateTo]);

      // 키보드 네비게이션
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "ArrowRight" || e.key === "ArrowDown") navigate(1);
          if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   navigate(-1);
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [navigate]);

      const wordData = VOCAB_DATA[currentIndex];

      return (
        <div className="app">
          {/* ── 헤더 ── */}
          <header className="app-header">
            <div className="header-badge">경찰대 기출</div>
            <h2 className="app-title">어원으로 배우는 영단어</h2>
            <div className="word-counter">
              {String(currentIndex + 1).padStart(2, "0")} / {String(VOCAB_DATA.length).padStart(2, "0")}
            </div>
          </header>

          {/* ── 본문 ── */}
          <main className="app-main">
            <button className="nav-btn" onClick={() => navigate(-1)} title="이전 (←)">&#8592;</button>

            <div ref={containerRef} className="card-container">
              {/* key가 바뀌면 컴포넌트를 언마운트·재마운트 → GSAP 재실행 */}
              <WordDisplay key={currentIndex} wordData={wordData} />
            </div>

            <button className="nav-btn" onClick={() => navigate(1)} title="다음 (→)">&#8594;</button>
          </main>

          {/* ── 진행 점 ── */}
          <div className="progress-dots">
            {VOCAB_DATA.map((_, i) => (
              <button
                key={i}
                className={`dot ${i === currentIndex ? "active" : ""}`}
                onClick={() => goTo(i)}
                title={VOCAB_DATA[i].word}
              />
            ))}
          </div>

          <p className="keyboard-hint">
            <kbd>←</kbd>&nbsp;<kbd>→</kbd> 키보드로도 이동할 수 있습니다
          </p>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
